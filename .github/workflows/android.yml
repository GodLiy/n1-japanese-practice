name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install SDK packages
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(echo "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | awk '{print $1}')
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Install
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      # Signed with android/sideload.keystore. This repository cannot store Actions secrets,
      # so the sideload certificate and its password live in the repo. It is not a Play upload key.
      - name: Build release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Name the APK
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.1"
          fi
          cp android/app/build/outputs/apk/release/app-release.apk "chowa-${VERSION}.apk"
          echo "APK_NAME=chowa-${VERSION}.apk" >> "$GITHUB_ENV"

      - name: Verify bundled audio and microphone permission
        run: |
          unzip -l "$APK_NAME" | grep -q 'assets/public/audio/ja/'
          if AAPT=$(ls -1 "$ANDROID_HOME"/build-tools/*/aapt 2>/dev/null | tail -n 1) && [ -n "$AAPT" ]; then
            "$AAPT" dump permissions "$APK_NAME" | grep -q android.permission.RECORD_AUDIO
          else
            unzip -p "$APK_NAME" AndroidManifest.xml | strings | grep -q RECORD_AUDIO
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 聴話 ${{ github.ref_name }}
          files: ${{ env.APK_NAME }}
          fail_on_unmatched_files: true
          body: |
            安卓安装包。网页版仍然是 https://godliy.github.io/n1-japanese-practice/

            ## 安装

            1. 下载本页的 `chowa-*.apk`。
            2. 在手机上打开这个文件。若系统提示未知来源，允许这次安装。
            3. 打开「聴話」。听、阅读和说播放安装包里的日语录音，不把稿子发到网上。
            4. 第一次点「说话」时，允许麦克风。声音只留在这台手机上，不会上传。
            5. 本机语音识别用完整的日语模型，第一次大约 100MB（模型约 80MB，运行库约 22MB），需要联网下载一次。下载时可以取消。下不来时，仍可以把句子打出来评分。声音不会上传。
